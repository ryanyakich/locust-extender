<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locust Shift Availability Checker</title>
  <style>
    html, body {
      width: 640px;
      max-width: 640px;
      min-width: 640px;
      min-height: 400px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      box-sizing: border-box;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    * {
      box-sizing: border-box;
      max-width: 100%;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #333;
    }
    .status {
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
      word-wrap: break-word;
    }
    .status.connected {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.disconnected {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.2s;
      box-sizing: border-box;
      max-width: 100%;
    }
    button.primary {
      background-color: #007bff;
      color: white;
    }
    button.primary:hover {
      background-color: #0056b3;
    }
    button.secondary {
      background-color: #6c757d;
      color: white;
    }
    button.secondary:hover {
      background-color: #545b62;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .data-display {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      flex: 1;
      min-height: 150px;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.4;
      width: 100%;
      box-sizing: border-box;
    }
    .data-display {
      display: none;
    }
    .data-display strong {
      color: #333;
    }
    .data-display span {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }
    .config-section {
      margin-bottom: 12px;
    }
    .config-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .config-section {
      flex: 1;
      margin-bottom: 0;
    }
    .config-section label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }
    select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      background-color: white;
    }
    select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }
    .multi-select-container {
      position: relative;
    }
    .multi-select-trigger {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      background-color: white;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 34px;
    }
    .multi-select-trigger:hover {
      border-color: #007bff;
    }
    .multi-select-trigger .placeholder {
      color: #6c757d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .multi-select-trigger .selected-count {
      color: #333;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .multi-select-trigger .arrow {
      transition: transform 0.2s ease;
      font-size: 12px;
    }
    .multi-select-trigger.open .arrow {
      transform: rotate(180deg);
    }
    .multi-select-dropdown {
      position: fixed;
      left: 16px;
      right: 16px;
      margin-top: 4px;
      background-color: white;
      border: 1px solid #ced4da;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: none;
    }
    .multi-select-dropdown.open {
      display: block;
    }
    .multi-select-option {
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #f1f3f4;
    }
    .multi-select-option:last-child {
      border-bottom: none;
    }
    .multi-select-option:hover {
      background-color: #f8f9fa;
    }
    .multi-select-option input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    .multi-select-option label {
      margin: 0;
      cursor: pointer;
      font-size: 13px;
      color: #333;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .multi-select-actions {
      padding: 6px 10px;
      border-top: 1px solid #dee2e6;
      background-color: #f8f9fa;
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }
    .multi-select-actions button {
      padding: 6px 12px;
      font-size: 12px;
      flex: none;
    }
    .favorites-container {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 8px;
      background-color: white;
      width: 100%;
      box-sizing: border-box;
    }
    .favorite-item {
      display: flex;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f1f3f4;
    }
    .favorite-item:last-child {
      border-bottom: none;
    }
    .favorite-item input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    .favorite-item label {
      cursor: pointer;
      font-size: 13px;
      color: #333;
      flex: 1;
    }
    .loading-favorites {
      color: #6c757d;
      font-style: italic;
      font-size: 13px;
      text-align: center;
      padding: 12px;
    }
    .no-favorites {
      color: #6c757d;
      font-size: 13px;
      text-align: center;
      padding: 12px;
    }
    .popup-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .popup-content > *:not(.data-display) {
      flex-shrink: 0;
    }
    #progressContainer {
      flex-shrink: 0;
    }
    .email-format-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 6px;
    }
    .tab-button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #dee2e6;
      border-radius: 4px 4px 0 0;
      background-color: #f8f9fa;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #6c757d;
      transition: all 0.2s;
      margin-bottom: -7px;
    }
    .tab-button:hover {
      background-color: #e9ecef;
    }
    .tab-button.active {
      background-color: white;
      border-bottom: 2px solid white;
      color: #007bff;
      font-weight: 600;
      z-index: 1;
    }
    .update-notification {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #856404;
    }
    .update-notification h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: #856404;
    }
    .update-notification p {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #856404;
    }
    .update-notification .version-info {
      font-weight: 600;
      color: #856404;
    }
    .update-notification .release-notes {
      margin: 8px 0;
      padding: 8px;
      background-color: #fff;
      border-radius: 4px;
      font-size: 12px;
      color: #333;
      max-height: 100px;
      overflow-y: auto;
    }
    .update-notification .button-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .update-notification button {
      flex: 1;
      padding: 6px 12px;
      font-size: 12px;
    }
    .update-notification button.update {
      background-color: #007bff;
      color: white;
    }
    .update-notification button.update:hover {
      background-color: #0056b3;
    }
    .update-notification button.dismiss {
      background-color: #6c757d;
      color: white;
    }
    .update-notification button.dismiss:hover {
      background-color: #545b62;
    }
    .settings-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .settings-modal.open {
      display: flex;
    }
    .settings-content {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .settings-content h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #333;
    }
    .settings-item {
      margin-bottom: 16px;
    }
    .settings-item label {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #333;
      cursor: pointer;
    }
    .settings-item input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    .settings-item p {
      margin: 4px 0 0 0;
      font-size: 11px;
      color: #6c757d;
    }
    .settings-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .settings-buttons button {
      padding: 6px 12px;
      font-size: 12px;
      flex: none;
    }
  </style>
</head>
<body>
  <div class="popup-content">
    <h1>Locust Shift Availability Checker</h1>
    
    <div id="updateNotification" class="update-notification" style="display: none;">
      <h3>🔄 Update Available</h3>
      <p>A new version (<span id="latestVersion" class="version-info"></span>) is available!</p>
      <div id="releaseNotes" class="release-notes"></div>
      <div class="button-group">
        <button id="downloadUpdate" class="update">Download Update</button>
        <button id="dismissUpdate" class="dismiss">Dismiss</button>
      </div>
    </div>
    
    <div id="status" class="status disconnected">
      Not connected to locustspw.org
    </div>
    
    <div id="progressContainer" style="display: none; margin-bottom: 12px; width: 100%; box-sizing: border-box;">
      <div id="progressBar" style="height: 6px; background-color: #e9ecef; border-radius: 4px; overflow: hidden; width: 100%; box-sizing: border-box;">
        <div id="progressFill" style="height: 100%; background-color: #007bff; width: 0%; transition: width 0.3s ease; box-sizing: border-box;"></div>
      </div>
      <div id="progressText" style="font-size: 11px; color: #6c757d; margin-top: 3px; text-align: center; width: 100%; box-sizing: border-box;"></div>
    </div>
  
    <div class="config-row">
      <div class="config-section">
        <label for="dayRange">Date range:</label>
        <select id="dayRange">
          <option value="this_week">This week (Mon-Sun)</option>
          <option value="next_week">Next week (Mon-Sun)</option>
          <option value="next_two_weeks">Next 2 weeks (Mon-Sun)</option>
          <option value="next_three_weeks">Next 3 weeks (Mon-Sun)</option>
          <option value="3">3 days</option>
          <option value="5">5 days</option>
          <option value="7">7 days</option>
          <option value="custom">Custom range</option>
        </select>
      </div>
      
      <div class="config-section">
        <label>Locations:</label>
        <div class="multi-select-container">
          <div id="locationMultiSelectTrigger" class="multi-select-trigger">
            <span class="placeholder">Select locations...</span>
            <span class="arrow">▼</span>
          </div>
          <div id="locationMultiSelectDropdown" class="multi-select-dropdown">
            <div id="locationOptionsContainer">
              <div class="loading-favorites">Loading favorite locations...</div>
            </div>
            <div class="multi-select-actions">
              <button id="selectAllLocations" class="secondary">Select All</button>
              <button id="clearAllLocations" class="secondary">Clear All</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="customDateInputs" class="config-section" style="display: none; margin-bottom: 12px;">
      <label>Custom date range (max 4 weeks):</label>
      <div style="display: flex; gap: 8px;">
        <input type="date" id="customStartDate" style="flex: 1; padding: 6px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; box-sizing: border-box;">
        <input type="date" id="customEndDate" style="flex: 1; padding: 6px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; box-sizing: border-box;">
      </div>
      <div id="customDateError" style="color: #dc3545; font-size: 12px; margin-top: 4px; display: none;"></div>
    </div>
    
    <div class="button-group">
      <button id="fetchButton" class="primary">Check Shift Availability</button>
      <button id="emailButton" class="primary" style="display: none;">Copy Email Draft</button>
    </div>
    
    <div id="emailFormatTabs" class="email-format-tabs" style="display: none;">
      <button class="tab-button active" data-format="list">List Format</button>
      <button class="tab-button" data-format="table">Table Format</button>
    </div>
    
    <div id="emailPreview" class="email-preview" style="display: none; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 8px; margin-bottom: 12px; font-size: 13px; max-height: 200px; overflow-y: auto;"></div>
    
    <div id="dataDisplay" class="data-display"></div>
    
    <div style="text-align: center; margin-top: 8px;">
      <button id="checkUpdatesButton" style="background: none; border: none; color: #6c757d; font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0;">Check for updates</button>
      <button id="settingsButton" style="background: none; border: none; color: #6c757d; font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0; margin-left: 12px;">Settings</button>
    </div>
    
    <!-- Settings Modal -->
    <div id="settingsModal" class="settings-modal">
      <div class="settings-content">
        <h2>Settings</h2>
        <div class="settings-item">
          <label>
            <input type="checkbox" id="autoUpdateEnabled" checked>
            Enable automatic update checks
          </label>
          <p>Check for updates once per day when the extension starts</p>
        </div>
        <div class="settings-buttons">
          <button id="closeSettings" class="secondary">Close</button>
          <button id="saveSettings" class="primary">Save</button>
        </div>
      </div>
    </div>
    
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
